      <text x="395" y="90" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Oct 2026</text>
    
      <rect x="510" y="70" width="230" height="430" fill="#ffffff"/>
      <line x1="510" y1="70" x2="510" y2="500" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="625" y="90" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Nov 2026</text>
    
      <rect x="740" y="70" width="230" height="430" fill="#f8fafc"/>
      <line x1="740" y1="70" x2="740" y2="500" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="855" y="90" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Dec 2026</text>
    <line x1="970" y1="70" x2="970" y2="500" stroke="#e2e8f0" stroke-width="1.2"/>
