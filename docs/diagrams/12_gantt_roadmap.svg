    <rect x="340" y="62" width="100" height="20" rx="4" fill="#ef4444"/>
    <text x="390" y="76" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">MIDTERM (OCT 21)</text>
  
      <g transform="translate(0, 110)">
